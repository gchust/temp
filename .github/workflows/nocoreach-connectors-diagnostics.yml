name: NocoReach connector bounded diagnostics
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/nocoreach-connectors-diagnostics.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract application failure diagnostics without dumping full logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://api.github.com/repos/gchust/temp/actions/jobs/116333826265/logs';
          const response = await fetch(endpoint, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
          if (!response.ok) throw new Error(`Cannot read job log: ${response.status}`);
          const lines = (await response.text()).replace(/\u001b\[[0-9;]*m/g, '').split('\n');
          const chosen = new Set();
          for (let i = 0; i < lines.length; i++) {
            if (/error TS\d|FAIL |AssertionError|Error:|tests=|Test Files|Tests\s+\d|passed|failed|BROWSER_|RESULT|IMPLEMENTATION_|exit code|TimeoutError|ERR_/i.test(lines[i]) && !/npm WARN|WARN deprecated|apt\/|Get:|Reading database|sha256|AUTHORIZATION/i.test(lines[i])) {
              for (let j = Math.max(0, i - 2); j <= Math.min(lines.length - 1, i + 5); j++) chosen.add(j);
            }
          }
          const selected = [...chosen].sort((a,b) => a-b).slice(-240).map(i => lines[i]);
          console.log('BOUNDED_APPLICATION_DIAGNOSTICS_BEGIN');
          console.log(selected.join('\n'));
          console.log('BOUNDED_APPLICATION_DIAGNOSTICS_END');
          NODE
