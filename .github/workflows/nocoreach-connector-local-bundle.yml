name: NocoReach connector local bundle
on:
  push:
    paths:
      - '.github/workflows/nocoreach-connector-local-bundle.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nocobase/NocoReach
          ref: 4367128dce60e93116a6cd089c605b190f7a523a
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Export source and runtime for local work
        run: |
          mkdir -p export
          git -C source switch -c refactor/connector-plugins
          tar -czf export/nocoreach-source.tar.gz -C source .
          cp "$(command -v node)" export/node
          tar -czf export/node-runtime.tar.gz -C export node
          rm export/node
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: nocoreach-connector-source
          path: export/*.tar.gz
          retention-days: 7
      - name: Prepare locked dependencies
        working-directory: source
        run: |
          npm install --global pnpm@11.7.0
          pnpm install --frozen-lockfile
      - name: Export offline dependencies without credentials or application data
        run: |
          tar -czf export/nocoreach-dependencies.tar.gz -C source node_modules .agents app-plugins/nocoreach-mock/node_modules
          sha256sum export/*.tar.gz > export/SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: nocoreach-connector-dependencies
          path: |
            export/nocoreach-dependencies.tar.gz
            export/SHA256SUMS
          retention-days: 7
